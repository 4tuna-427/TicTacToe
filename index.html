<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common.css">
    <title>maru-batsu</title>
</head>

<body>
    <h1 class="title">maru-batsu</h1>

    <div class="current-player-text">
        Turn: <span data-js-current-player></span>
    </div>

    <div class="board">
        <div class="square-container" data-js-board>
            <div class="square" data-index="0" data-js-square></div>
            <div class="square" data-index="1" data-js-square></div>
            <div class="square" data-index="2" data-js-square></div>
            <div class="square" data-index="3" data-js-square></div>
            <div class="square" data-index="4" data-js-square></div>
            <div class="square" data-index="5" data-js-square></div>
            <div class="square" data-index="6" data-js-square></div>
            <div class="square" data-index="7" data-js-square></div>
            <div class="square" data-index="8" data-js-square></div>
        </div>
    </div>

    <div>
        <button type="button" class="reset-btn" data-js-reset-btn>リセット</button>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
